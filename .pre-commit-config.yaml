fail_fast: true    # stop at the first failing hook

repos:
  # runs first: strips notebook outputs before check-added-large-files
  # (and everything else) sees the staged content
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout       # strips notebook outputs so plots/tables don't bloat the repo

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.8
    hooks:
      - id: uv-lock          # keeps uv.lock in sync with pyproject.toml

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # local hooks run against the uv-locked environment, so uv.lock is the
  # single source of truth for tool versions — no second `rev:` pin to drift.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false   # mypy needs the whole package, not staged files

      # pre-push, not pre-commit: the full suite is worth blocking a push over,
      # but running it on every single commit is what gets --no-verify'd once
      # the suite grows.
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
